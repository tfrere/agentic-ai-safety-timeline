name: Daily watch

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan sources
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCH_MODEL: anthropic/claude-fable-5.1
        run: python watch/run.py

      - name: Commit state
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add watch/state.json watch/last-report.md
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore(watch): daily scan $(date -u +%Y-%m-%d)"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          fi
