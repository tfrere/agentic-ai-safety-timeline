name: Daily watch

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and apply
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCH_MODEL: anthropic/claude-fable-5.1
        run: python watch/run.py

      - name: Commit timeline
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add data.js TIMELINE.md watch/state.json watch/last-report.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            if git diff --cached --name-only | grep -qx data.js; then
              MSG="feat(watch): apply timeline events $(date -u +%Y-%m-%d)"
            else
              MSG="chore(watch): daily scan $(date -u +%Y-%m-%d)"
            fi
            git commit -m "$MSG"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main
          fi

      - name: Push Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +x
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not set; skipping Space push"
            exit 0
          fi
          git clone --depth 1 "https://tfrere:${HF_TOKEN}@huggingface.co/spaces/tfrere/agentic-ai-safety-timeline" /tmp/hf-space
          cp data.js TIMELINE.md /tmp/hf-space/
          cd /tmp/hf-space
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add data.js TIMELINE.md
          if git diff --cached --quiet; then
            echo "Space already up to date"
            exit 0
          fi
          git commit -m "feat(watch): apply timeline events $(date -u +%Y-%m-%d)"
          git push
