[project]
name = "agentic-ai-safety-watch"
version = "0.1.0"
description = "Daily Pydantic AI watch agent for the agentic AI safety timeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watch"]
